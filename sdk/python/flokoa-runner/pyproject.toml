[project]
name = "flokoa-runner"
version = "0.2.0"
description = "Flokoa generic runner: hydrates compiled AgentSpecs into served pydantic-ai agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flokoa[pydantic-ai,tracing]",
    # The runner baseline pin. This is "the platform" (runtime contract, contractVersion 1):
    # one exact pydantic-ai version per runner release. Bumping it requires regenerating
    # runner.lock, runner-manifest.json, and the embedded AgentSpec JSON schema
    # (make runner-contract), and is a PR-blocking review item.
    "pydantic-ai==1.107.0",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    # First-party built-in capabilities baked into the runner image (source:
    # builtin tier). They install into the venv via uv sync and ride into the
    # runtime stage, so attaching one downloads nothing. Their non-baseline
    # transitive deps land in runner.lock and become baseline packages — by
    # design (one pod, one env; a third-party cap pinning a different version
    # is then a correct admission conflict). Pinned to the baseline pydantic-ai.
    # flokoa-codemode-mcp is NOT baked in: it is an MCP server, not an
    # AbstractCapability subclass (architecture §2.7) — future built-in once it
    # grows a capability-class entrypoint.
    "flokoa-openapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flokoa_runner"]

[tool.uv]
package = true

[tool.uv.sources]
flokoa = { workspace = true }
flokoa-types = { workspace = true }
flokoa-openapi = { workspace = true }

[dependency-groups]
dev = [
    "a2a-sdk>=0.3.22",
    "anyio>=4.0",
    "httpx>=0.27",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
