{{/*
Built-in (source: builtin) Capability CRs. The capabilities are baked into the
runner image (architecture §2.2), so these CRs carry no artifact — they exist so
that attaching them to an Agent needs no download. They are generated by
flokoa-runner/hack/gen_builtin_capabilities.py and committed under
files/builtin-capabilities/, then rendered here (the same files/-then-template
pattern the chart uses for CRDs).

Installation is gated by capabilities.builtin.install (default true). The CRs are
namespaced; they install into capabilities.builtin.namespace if set, else the
release namespace. Attaching Agents must be in the same namespace
(cross-namespace capability refs are unsupported — roadmap 08).
*/}}
{{- if .Values.capabilities.builtin.install }}
{{- $ns := default .Release.Namespace .Values.capabilities.builtin.namespace }}
{{- range $path, $_ := .Files.Glob "files/builtin-capabilities/*.yaml" }}
{{- $cr := $.Files.Get $path | fromYaml }}
{{- if $cr.metadata }}
{{- $_ := set $cr.metadata "namespace" $ns }}
{{- $labels := default (dict) $cr.metadata.labels }}
{{- $_ := set $labels "app.kubernetes.io/managed-by" $.Release.Service }}
{{- $_ := set $labels "app.kubernetes.io/part-of" "flokoa" }}
{{- $_ := set $labels "flokoa.ai/builtin-capability" "true" }}
{{- $_ := set $cr.metadata "labels" $labels }}
{{- end }}
---
{{ toYaml $cr }}
{{- end }}
{{- end }}
